<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3b47">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>קריאה באנגלית</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--line:#e4ddd2;--ink:#3d2f2c;--muted:#8a7d76;--teal:#1f3b47;--gold:#b8892e;
  --l1:#3b7a5e;--l2:#2f6690;--l3:#8a3b4b;--read:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px}
.top h1{font:700 21px/1.2 Georgia,"Times New Roman",serif;margin:0;flex:1}
.net{font-size:12px;padding:3px 9px;border-radius:20px;background:#e8f1ec;color:var(--l1)}
.net.off{background:#f6e7e4;color:#9b3d2e}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
nav button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 2px;font-size:14px}
nav button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
main{padding:14px 14px 90px;max-width:760px;margin:0 auto}
.muted{color:var(--muted);font-size:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.btn{border:0;background:var(--teal);color:#fff;border-radius:12px;padding:10px 14px}
.btn.ghost{background:transparent;color:var(--teal);border:1px solid var(--teal)}
.btn.small{padding:6px 10px;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:30px;padding:7px 16px}
#levels .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#levels .chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;flex:none}
.chips button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.book{position:relative;display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;margin-bottom:10px;cursor:pointer}
.cover{flex:none;position:relative;width:62px;height:88px;border-radius:3px 9px 9px 3px;color:#fff;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(60,40,20,.25);direction:ltr}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:rgba(0,0,0,.22)}
.cover b{font:700 28px/1 Georgia,serif;position:relative}
.cover i{display:block;width:26px;height:2px;background:#e9c97a;margin-top:8px;position:relative;opacity:.9}
.cover.sm{width:42px;height:60px}.cover.sm b{font-size:20px}.cover.sm i{width:18px;margin-top:5px}
.book .info{flex:1;min-width:0}
.book .he{font-weight:700;font-size:17px;line-height:1.3;margin:0;padding-left:30px}
.book .en{direction:ltr;text-align:right;font:italic 14px/1.3 Georgia,serif;color:#5a4d47;margin-top:1px}
.book .a{font-size:12.5px;color:var(--muted);direction:ltr;text-align:right}
.book .desc{font-size:13.5px;line-height:1.45;color:#5a4d47;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book .meta{font-size:12px;color:var(--muted);margin-top:7px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.book .dl{position:absolute;top:10px;left:10px;min-width:0;width:34px;height:34px;padding:0;border-radius:50%;font-size:15px}
.cont{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;scrollbar-width:none}
.cont .c{flex:none;width:240px;display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer}
.cont .c .t{font-weight:700;font-size:14.5px;line-height:1.25}
.cont .c .muted{font-size:12px}
h3.sec{font-size:15px;margin:14px 2px 8px;color:var(--muted);font-weight:600}
.bar{height:5px;background:#eee7dc;border-radius:5px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--gold)}
.dl{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 10px;font-size:13px}
.dl.ok{color:var(--l1);border-color:#cfe2d7;background:#f1f8f4}
.lvl{border-radius:20px;padding:1px 8px;color:#fff;font-size:11px}
/* reader */
#reader{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column}
#reader.open{display:flex}
.rtop{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;border-bottom:1px solid var(--line)}
.rtop .ttl{flex:1;min-width:0;font:700 15px Georgia,serif;direction:ltr;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{border:1px solid var(--line);background:var(--card);border-radius:10px;min-width:38px;height:38px;padding:0 8px}
#reader{--rbg:#faf8f5;--rink:#2f2522;--rmute:#8a7d76;--rsv:#fbeec9;--rsel:#cfe0ea}
#reader.sepia{--rbg:#f4ecd8;--rink:#4a3b2a;--rmute:#8f7c60;--rsv:#ecd9a4;--rsel:#d8cdb0}
#reader.dark{--rbg:#17191c;--rink:#d6d0c6;--rmute:#8b8f96;--rsv:#4a4126;--rsel:#2d4656}
#reader{background:var(--rbg)}
#reader .rtop,#reader .rbot{background:var(--rbg);border-color:color-mix(in srgb,var(--rmute) 30%,transparent)}
#reader .icon{background:transparent;color:var(--rink);border-color:color-mix(in srgb,var(--rmute) 40%,transparent)}
#reader .ttl,#reader .pg{color:var(--rink)}
#page{flex:1;overflow-y:auto;padding:22px 20px 40px;color:var(--rink);background:var(--rbg);direction:ltr;text-align:justify;
  hyphens:auto;-webkit-hyphens:auto;font-size:var(--read);line-height:1.6;font-family:var(--rfont);-webkit-text-size-adjust:100%}
#reader{--rfont:Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
#reader.serif{--rfont:"Noto Serif",Georgia,"Times New Roman",serif}
#page h2{font-family:var(--rfont)}
#page .in{max-width:34em;margin:0 auto}
#page p{margin:0;text-indent:1.4em}
#page p.first,#page h2+p,#page .v+p{text-indent:0}
#page p+p{margin-top:.15em}
#page h2{font:700 1.15em/1.35 Georgia,"Noto Serif",serif;text-align:center;margin:1.2em 0 1.1em;letter-spacing:.02em;hyphens:none}
#page .v{text-align:left;text-indent:0;margin:.1em 0;padding-left:1em;font-size:.95em;color:var(--rink);hyphens:none}
#page .v+p,#page h2+p{margin-top:.6em}
#page .end{text-align:center;color:var(--rmute);font-size:.8em;margin-top:2em;text-indent:0}
#page .w{border-radius:4px}
#page .w.sv{background:var(--rsv)}
#page .w.sel{background:var(--rsel)}
#chap{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);display:none}
#chap.open{display:block}
#chap .panel{position:absolute;left:0;right:0;bottom:0;max-height:75vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:14px 10px calc(14px + env(safe-area-inset-bottom))}
#chap button{display:block;width:100%;text-align:left;direction:ltr;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 10px;font:16px Georgia,serif}
#chap button.on{font-weight:700;background:#f1ece3}
.rbot{direction:ltr;display:flex;align-items:center;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.rbot input{flex:1;min-width:0;width:0;accent-color:var(--teal)}
.pg{font-size:13px;color:var(--muted);min-width:64px;text-align:center;white-space:nowrap}
#reader{overflow:hidden}
#reader .icon{flex:none}
#rset{display:none;position:absolute;top:calc(56px + env(safe-area-inset-top));left:8px;right:8px;z-index:3;background:var(--card);color:var(--ink);border:1px solid var(--line);
  border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px 12px}
#rset.open{display:block}
#rset .srow{display:flex;align-items:center;gap:8px;padding:8px 0;flex-wrap:wrap}
#rset .srow span{flex:1;min-width:70px;font-size:14px}
#rset .icon{color:var(--ink);background:var(--bg);border-color:var(--line)}
#rset .ff.on,#rset .th.on{background:var(--teal);color:#fff;border-color:var(--teal)}
#rset b{min-width:26px;text-align:center}
@media (max-width:340px){
  .rbot input{display:none}
  .pg{flex:1}
  #page{padding:14px 12px 30px;text-align:left}
  #page p{text-indent:1em}
  .rtop,.rbot{gap:6px;padding-left:6px;padding-right:6px}
  .icon{min-width:34px;height:34px;padding:0 6px}
}
/* sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top-left-radius:20px;border-top-right-radius:20px;
  box-shadow:0 -6px 24px rgba(0,0,0,.15);padding:14px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .2s}
#sheet.open{transform:none}
.sw{display:flex;align-items:baseline;gap:10px;direction:ltr}
.sw b{font:700 26px Georgia,serif}
.sw .form{color:var(--muted);font-size:14px}
.he{font-size:22px;font-weight:600;margin:6px 0}
.def{direction:ltr;text-align:left;color:#5a4d47;font-size:15px;margin-bottom:6px}
.src{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;margin-top:10px}
.row .btn{flex:1}
/* saved / review */
.word{display:flex;gap:10px;align-items:flex-start}
.word .en{direction:ltr;text-align:left;flex:1}
.word .en b{font:700 18px Georgia,serif}
.ctx{direction:ltr;text-align:left;font:15px/1.5 Georgia,serif;color:#5a4d47;margin-top:4px}
.ctx mark{background:#fbeec9;color:inherit;border-radius:3px}
.card{text-align:center;padding:26px 16px}
.card .big{font:700 34px Georgia,serif;direction:ltr}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stats div{flex:1;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px}
.stats b{display:block;font-size:22px}
textarea{width:100%;min-height:220px;border:1px solid var(--line);border-radius:14px;padding:12px;font:18px/1.6 Georgia,serif;direction:ltr;text-align:left;background:#fff}
.tag{display:inline-block;direction:ltr;border:1px solid var(--line);border-radius:20px;padding:3px 10px;margin:3px;font-size:14px}
.tag.used{background:#e8f1ec;border-color:#cfe2d7;color:var(--l1)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#333;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;z-index:50;display:none}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <div class="top"><h1>📖 קריאה באנגלית</h1><span id="net" class="net">מחובר</span></div>
  <nav>
    <button data-v="lib" class="on">📚 ספרייה</button>
    <button data-v="saved">⭐ שמורות <span id="nSaved"></span></button>
    <button data-v="review">🔄 חזרה <span id="nDue"></span></button>
    <button data-v="write">✍️ כתיבה</button>
  </nav>
</header>

<main>
  <section id="v-lib">
    <div class="box" id="status"></div>
    <div id="levels" style="margin:12px 0"></div>
    <div id="books"></div>
  </section>
  <section id="v-saved" class="hidden"></section>
  <section id="v-review" class="hidden"></section>
  <section id="v-write" class="hidden"></section>
</main>

<div id="reader">
  <div class="rtop">
    <button class="icon" id="rBack">→</button>
    <button class="icon" id="rToc" title="פרקים">☰</button>
    <div class="ttl" id="rTitle"></div>
    <button class="icon" id="rSet" title="תצוגה">Aa</button>
  </div>
  <div id="rset">
    <div class="srow"><span>גודל אות</span><button class="icon" id="fMinus">A−</button><b id="fVal"></b><button class="icon" id="fPlus">A+</button></div>
    <div class="srow"><span>גופן</span><button class="icon ff" data-f="">רגיל</button><button class="icon ff" data-f="serif" style="font-family:Georgia,serif">ספרותי</button></div>
    <div class="srow"><span>רקע</span><button class="icon th" data-t="">בהיר</button><button class="icon th" data-t="sepia">חם</button><button class="icon th" data-t="dark">לילה</button></div>
  </div>
  <div id="page" lang="en"></div>
  <div class="rbot">
    <button class="icon" id="pPrev">‹</button>
    <span class="pg" id="pNum"></span>
    <input type="range" id="pSlider" min="1" value="1">
    <button class="icon" id="pNext">›</button>
  </div>
</div>

<div id="sheet">
  <div class="sw"><b id="sWord"></b><span class="form" id="sForm"></span></div>
  <div class="he" id="sHe"></div>
  <div class="def" id="sDef"></div>
  <div class="src" id="sSrc"></div>
  <div class="row">
    <button class="btn ghost" id="sSpeak">🔊 השמע</button>
    <button class="btn" id="sSave">⭐ שמור</button>
    <button class="btn ghost" id="sClose">סגור</button>
  </div>
</div>
<div id="chap"><div class="panel"><div class="muted" style="padding:0 10px 8px">פרקים</div><div id="chapList"></div></div></div>
<div id="toast"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const LEVELS = {1: ['בינוני', 'var(--l1)'], 2: ['מתקדם', 'var(--l2)'], 3: ['מומחה', 'var(--l3)']};
const WORDS_PER_PAGE = 380;
const BOOK_CACHE = 'books-v2';
const DAY = 864e5, INTERVALS = [0, 1, 3, 7, 16, 35, 90];

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { toast('אין מקום לשמירה בטלפון'); } }
};
let books = [], dict = {l: {}, f: {}}, dictReady = false;
let saved = store.get('saved', []);
let progress = store.get('progress', {});
let webdict = store.get('webdict', {});
let level = 0, offline = new Set();
const GENRES = [['', 'הכול'], ['mystery', '🔍 מתח ובלש'], ['adventure', '🧭 הרפתקאות'], ['classic', '📜 קלאסיקה'], ['kids', '🧒 ילדים ונוער']];
let genre = store.get('genre', '');
const inGenre = b => !genre || b.genre === genre;
// default size fits the real width (phones with enlarged text get a smaller default)
const autoFont = innerWidth < 300 ? 15 : innerWidth < 360 ? 16 : 18;
let fontSize = store.get('font2', autoFont);
let fontFam = store.get('fontFam', '');
let theme = store.get('theme', '');

function toast(t) { const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 2200); }
function esc(s) { return s.replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])); }

/* ---------- network badge ---------- */
function net() { const on = navigator.onLine; const el = $('#net'); el.textContent = on ? 'מחובר' : 'אופליין'; el.className = 'net' + (on ? '' : ' off'); }
addEventListener('online', net); addEventListener('offline', net);

/* ---------- tabs ---------- */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.v));
function show(v) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  ['lib', 'saved', 'review', 'write'].forEach(x => $('#v-' + x).classList.toggle('hidden', x !== v));
  if (v === 'saved') renderSaved();
  if (v === 'review') renderReview();
  if (v === 'write') renderWrite();
  scrollTo(0, 0);
}
function counts() {
  $('#nSaved').textContent = saved.length ? '(' + saved.length + ')' : '';
  const due = saved.filter(s => (s.due || 0) <= Date.now()).length;
  $('#nDue').textContent = due ? '(' + due + ')' : '';
}

/* ---------- library ---------- */
async function loadBooks() {
  try { books = await (await fetch('data/books.json')).json(); }
  catch (e) { $('#books').innerHTML = '<div class="box">לא הצלחתי לטעון את רשימת הספרים. פתח את האפליקציה פעם אחת עם אינטרנט.</div>'; return; }
  await checkOffline();
  renderLevels(); renderBooks();
}
async function checkOffline() {
  if (!('caches' in window)) return;
  const c = await caches.open(BOOK_CACHE);
  await Promise.all(books.map(async b => { if (await c.match(b.file)) offline.add(b.id); }));
  renderStatus();
}
function renderStatus() {
  const n = Object.keys(dict.l).length;
  $('#status').innerHTML =
    `<div>${books.length} ספרים מלאים · <b>${offline.size}</b> שמורים בטלפון לקריאה בלי אינטרנט</div>
     <div class="muted">מילון אופליין: ${dictReady ? (n ? n.toLocaleString() + ' מילים ✓' : 'לא זמין, משתמש בתרגום מהאינטרנט') : 'נטען…'}</div>
     ${offline.size < books.length ? `<button class="btn" id="dlAll" style="margin-top:8px;width:100%">⬇ שמור את כל הספרים בטלפון</button>` : ''}`;
  const b = $('#dlAll'); if (b) b.onclick = downloadAll;
}
function renderLevels() {
  const chip = (attr, v, t, on, n) => `<button ${attr}="${v}" class="${on ? 'on' : ''}">${t} <span style="opacity:.6">${n}</span></button>`;
  $('#levels').innerHTML =
    '<div class="chips" style="margin:0 0 8px">' + GENRES.map(([v, t]) => chip('data-g', v, t, v === genre, books.filter(b => !v || b.genre === v).length)).join('') + '</div>' +
    '<div class="chips" style="margin:0">' + [[0, 'כל הרמות'], [1, 'בינוני'], [2, 'מתקדם'], [3, 'מומחה']]
      .map(([v, t]) => chip('data-l', v, t, v === level, books.filter(b => inGenre(b) && (!v || b.level === v)).length)).join('') + '</div>';
  $('#levels').querySelectorAll('[data-g]').forEach(b => b.onclick = () => { genre = b.dataset.g; store.set('genre', genre); renderLevels(); renderBooks(); });
  $('#levels').querySelectorAll('[data-l]').forEach(b => b.onclick = () => { level = +b.dataset.l; renderLevels(); renderBooks(); });
}
function bookPages(b) { return Math.max(1, Math.ceil(b.words / WORDS_PER_PAGE)); }
const COVERS = ['#1f3b47', '#3b6e5a', '#7a3b46', '#2f5d8a', '#6b4e2e', '#4a3f6b', '#2e6b6b', '#8a5a2b', '#3d4f2f', '#5b2f4f'];
function cover(b, sm) {
  const w = b.title.replace(/^(The|A|An)\s+/i, '');
  return `<div class="cover${sm ? ' sm' : ''}" style="background:linear-gradient(160deg,${COVERS[b.id % COVERS.length]},${COVERS[(b.id + 3) % COVERS.length]})"><b>${esc(w[0])}</b><i></i></div>`;
}
function readTime(words) { const m = words / 170; return m < 60 ? Math.round(m / 5) * 5 + ' דק׳' : 'כ-' + (Math.round(m / 30) / 2) + ' שעות'; }
function pct(id) { const p = progress[id]; return p ? Math.max(1, Math.round(100 * (p.page + 1) / p.pages)) : 0; }
function renderBooks() {
  const list = books.filter(b => inGenre(b) && (!level || b.level === level)).sort((a, b) => a.level - b.level || a.words - b.words);
  const reading = books.filter(b => progress[b.id]).sort((a, b) => progress[b.id].at - progress[a.id].at).slice(0, 4);
  let html = '';
  if (reading.length && !level && !genre) {
    html += '<h3 class="sec">📖 המשך לקרוא</h3><div class="cont">' + reading.map(b => `
      <div class="c" data-id="${b.id}">${cover(b, 1)}<div style="flex:1;min-width:0"><div class="t">${esc(b.he || b.title)}</div>
        <div class="muted">נקראו ${pct(b.id)}%</div><div class="bar"><i style="width:${pct(b.id)}%"></i></div></div></div>`).join('') + '</div>';
    html += '<h3 class="sec">כל הספרים</h3>';
  }
  html += list.map(b => {
    const [lt, lc] = LEVELS[b.level];
    const p = pct(b.id), ok = offline.has(b.id);
    return `<div class="book" data-id="${b.id}">
      ${cover(b)}

        <div class="he">${esc(b.he || b.title)}</div>

let challenge = null;
function renderWrite() {
  const v = $('#v-write'); const draft = store.get('draft', ''); const list = store.get('writings', []);
  if (!challenge) {
    const pool = saved.slice(0, 40).sort(() => Math.random() - .5);
    challenge = {prompt: PROMPTS[Math.floor(Math.random() * PROMPTS.length)], words: pool.slice(0, 5).map(s => s.lemma)};
  }
  v.innerHTML = `<div class="box"><div class="muted">נושא לכתיבה</div><div style="direction:ltr;text-align:left;font:17px Georgia,serif">${esc(challenge.prompt)}</div>
    ${challenge.words.length ? `<div class="muted" style="margin-top:8px">נסה לשלב מילים ששמרת:</div><div id="wTags"></div>` : ''}
    <button class="btn ghost small" id="wNew" style="margin-top:8px">🎲 נושא אחר</button></div>
    <textarea id="wText" placeholder="Start writing here…">${esc(draft)}</textarea>
    <div class="row"><span class="muted" id="wCount" style="flex:1;align-self:center"></span><button class="btn" id="wSave">שמור טקסט</button></div>
    ${list.length ? '<h3 style="margin:18px 0 8px">טקסטים קודמים</h3>' + list.map((w, i) => `<div class="box"><div class="muted">${new Date(w.at).toLocaleDateString('he-IL')} · ${w.n} מילים <button class="icon" data-wdel="${i}" style="float:left">🗑</button></div><div class="ctx">${esc(w.text).replace(/\n/g, '<br>')}</div></div>`).join('') : ''}`;
  const ta = $('#wText');
  const upd = () => {
    const t = ta.value; store.set('draft', t);
    const words = (t.match(WORD_RE) || []).map(norm);
    $('#wCount').textContent = words.length + ' מילים';
    const tg = $('#wTags'); if (tg) tg.innerHTML = challenge.words.map(w => `<span class="tag ${words.some(x => x === w || lookupLocal(x).lemma === w) ? 'used' : ''}">${esc(w)}</span>`).join('');
  };
  ta.oninput = upd; upd();
  $('#wNew').onclick = () => { challenge = null; renderWrite(); };
  $('#wSave').onclick = () => {
    const t = ta.value.trim(); if (!t) return;
    list.unshift({text: t, at: Date.now(), n: (t.match(WORD_RE) || []).length, prompt: challenge.prompt});
    store.set('writings', list); store.set('draft', ''); challenge = null; toast('נשמר ✓'); renderWrite();
  };
  v.querySelectorAll('[data-wdel]').forEach(b => b.onclick = () => { if (confirm('למחוק את הטקסט?')) { list.splice(+b.dataset.wdel, 1); store.set('writings', list); renderWrite(); } });
}

/* ---------- start ---------- */
net(); counts();
loadBooks(); loadDict();
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(() => {});
  // a new version was installed: reload once so everything (books, dictionary) comes from the new version
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController) return;
    if ($('#reader').classList.contains('open')) toast('גרסה חדשה הותקנה, תיטען בפתיחה הבאה');
    else location.reload();
  });
}
