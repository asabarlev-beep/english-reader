name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore books and dictionary
        uses: actions/cache@v4
        with:
          path: cache
          key: data-${{ hashFiles('scripts/*.py') }}
          restore-keys: data-
      - name: Download books and build dictionary
        run: python scripts/build_data.py data
      - name: Machine-translate words missing Hebrew
        continue-on-error: true
        timeout-minutes: 40
        run: |
          if python -c "import json,sys; sys.exit(0 if json.load(open('cache/data/dict.json')).get('mt') else 1)"; then
            echo "already translated"
          else
            pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
            pip install --quiet transformers sentencepiece sacremoses
            python scripts/mt_fill.py
          fi
      - name: Assemble site
        run: python scripts/build_data.py site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
